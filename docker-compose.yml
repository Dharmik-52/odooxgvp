services:
  backend:
    container_name: fleetflow-backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:////app/data/fleetflow.db
      - SECRET_KEY=your-secret-key-change-in-production
    volumes:
      - backend-data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    networks:
      - fleetflow-network
    restart: unless-stopped

  frontend:
    container_name: fleetflow-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000/api/v1
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - fleetflow-network
    restart: unless-stopped

volumes:
  backend-data:

networks:
  fleetflow-network:
    driver: bridge
